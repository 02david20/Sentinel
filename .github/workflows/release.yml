name: release
# Publishes a GitHub release with binaries, checksums and Linux packages when a version tag is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write            # create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the changelog needs the tag history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: tests must pass before anything is published
        run: |
          go vet ./...
          go test ./... -race -count=1
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}   # when the brews block is enabled
